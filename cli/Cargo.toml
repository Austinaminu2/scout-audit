[package]
name = "soroban-audit-prep"
version = "0.1.0"
edition = "2024"
description = "Audit preparation tool for Soroban smart contracts"
license = "MIT"
keywords = ["soroban", "stellar", "audit", "security"]

[[bin]]
name = "audit-prep"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time"] }
walkdir = "2.5.0"
walrus = "0.26.5"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
